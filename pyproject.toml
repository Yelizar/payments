[project]
name = "payment-service"
version = "0.1.0"
description = "Payment service"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.0",
    "aio-pika>=9.6.2",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "faststream[rabbit]>=0.6.7",
    "greenlet>=3.5.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.48.0",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.0",
    "mypy>=1.15.0",
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app"]
src_paths = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
packages = ["app"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

